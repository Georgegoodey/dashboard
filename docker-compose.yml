# Postgres + PostGIS for the lettings app. The Python app runs natively (see README).
#   docker compose up -d db
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lettings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lettings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lettings}
      POSTGRES_DB: ${POSTGRES_DB:-lettings}
      TZ: Europe/London
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lettings} -d ${POSTGRES_DB:-lettings}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
