name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest   # Docker is preinstalled, which the integration tests (PostGIS container) need
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, types, tests, front-end build
        run: bash scripts/ci/check.sh
      # on main, keep the exact frontend build that was just tested, so the deploy job ships it instead of rebuilding
      - name: Keep the built frontend for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # Deploys to the Raspberry Pi once checks pass on main. main is protected, so a push to it is an accepted pull request.
  # It never runs for pull requests, so code from a fork cannot reach these secrets. Set-up: deploy/README.md.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-pi
      cancel-in-progress: false   # never interrupt a deploy half way
    permissions:
      contents: read
      id-token: write             # lets the job prove its identity to Tailscale (workload identity federation)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: frontend/dist
      - name: Package the release
        run: bash scripts/ci/package-release.sh release.tgz
      # a temporary node on your tailnet, tagged tag:ci, removed when the job ends
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.PI_HOST }}
      # The deploy key can only run /opt/lettings/bin/deploy-receive on the Pi (a forced command): it reads the tarball from
      # stdin and takes the commit sha as its argument. It switches releases, restarts the API and rolls back if /health fails.
      - name: Deploy to the Pi
        env:
          PI_HOST: ${{ vars.PI_HOST }}
          PI_DEPLOY_SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          PI_KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PI_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "deploy@${PI_HOST}" "${GITHUB_SHA}" < release.tgz
